name: probe-apis (temporary)
on:
  push:
    branches: [probe-apis2]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the LBA spec
        run: |
          curl -s -m 30 https://api.apprentissage.beta.gouv.fr/api/documentation/json -o o.json
          echo "=== security"; jq -c '.components.securitySchemes' o.json
          echo "=== params"; jq -c '.paths["/api/job/v1/search"].get.parameters[] | {name, required, d: (.description // "" | .[0:140]), s: .schema}' o.json | cut -c1-400
          echo "=== response"; jq -c '.paths["/api/job/v1/search"].get.responses["200"].content["application/json"].schema' o.json | head -c 1500; echo
          echo "=== job schema"; jq -c '.components.schemas | to_entries[] | select(.key|test("Job|job")) | {k: .key, props: (.value.properties // {} | keys)}' o.json | head -c 2500; echo
