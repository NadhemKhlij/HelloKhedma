# Runs one SQL file of this repository on the live Supabase database, on demand: Actions → "Run SQL on Supabase" → Run
# workflow (or Claude starts it). Replaces pasting the file into the SQL editor. Only supabase/seed.sql or a file in
# supabase/migrations/ is accepted, from the branch the workflow runs on (main by default). Uses the Supabase Management
# API (POST /v1/projects/<ref>/database/query) with the same SUPABASE_ACCESS_TOKEN secret and SUPABASE_URL variable as
# deploy-functions.yml. Seed and migrations are written to be safe to run twice. Prints the career paths afterwards.
name: Run SQL on Supabase

on:
  workflow_dispatch:
    inputs:
      file:
        description: "SQL file to run (supabase/seed.sql or supabase/migrations/<name>.sql)"
        type: string
        default: supabase/seed.sql

permissions:
  contents: read

concurrency:
  group: run-sql
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ inputs.file }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          FILE: ${{ inputs.file }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (see deploy-functions.yml)."; exit 1
          fi
          if ! echo "$FILE" | grep -Eq '^supabase/(seed\.sql|migrations/[0-9A-Za-z_.-]+\.sql)$' || [ ! -f "$FILE" ]; then
            echo "::error::Only supabase/seed.sql or an existing supabase/migrations/<name>.sql can be run."; exit 1
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::The SUPABASE_URL variable is missing or not a supabase.co address."; exit 1
          fi
          q() {
            jq -n --rawfile query "$1" '{query: $query}' > body.json
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @body.json)
            if [ "$code" -ge 300 ]; then echo "::error::Supabase answered $code: $(head -c 2000 out.json)"; exit 1; fi
          }
          q "$FILE"
          echo "Ran $FILE (commit $GITHUB_SHA)."
          printf '%s' "select id, name, name_fr, sort_order, (select count(*) from public.training_tracks t where t.path_id = p.id) as tracks from public.career_paths p order by sort_order;" > check.sql
          q check.sql
          jq -r '.[] | "\(.sort_order). \(.id) \(.name) / \(.name_fr) (\(.tracks) tracks)"' out.json
