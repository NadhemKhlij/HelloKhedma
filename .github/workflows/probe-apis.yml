name: probe-apis (temporary)
on:
  push:
    branches: [probe-apis2]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the LBA spec
        run: |
          curl -s -m 30 https://api.apprentissage.beta.gouv.fr/api/documentation/json -o o.json
          echo "=== servers"; jq -c '.servers' o.json
          echo "=== paths"; jq -r '.paths | keys[]' o.json | grep -i job
          P=$(jq -r '.paths | keys[]' o.json | grep -i "job/v1/search" | head -1); echo "== $P"
          echo "=== params"; jq -c --arg p "$P" '.paths[$p].get.parameters[] | {name, required, d: (.description // "" | .[0:160]), s: .schema}' o.json | cut -c1-420
          echo "=== response"; jq -c --arg p "$P" '.paths[$p].get.responses["200"].content["application/json"].schema' o.json | head -c 1200; echo
          echo "=== JobOfferRead"; jq -c '.components.schemas.JobOfferRead.properties | map_values(.properties // .type // .anyOf | if type=="object" then keys else . end)' o.json | head -c 2500; echo
