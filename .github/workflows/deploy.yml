# Builds HelloKhedma (Tailwind CSS + js/config.js) and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables tab:
#     SUPABASE_URL, SUPABASE_ANON_KEY (public by design), optional DEFAULT_COUNTRY
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions > Variables (Repository variables), then re-run this workflow."
            exit 1
          fi

      - name: Install
        run: npm install

      - name: Build CSS and config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          DEFAULT_COUNTRY: ${{ vars.DEFAULT_COUNTRY || 'fr' }}
        run: npm run build

      # Publish only the files the browser needs (no supabase/, scripts/ or node_modules/).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js content _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
