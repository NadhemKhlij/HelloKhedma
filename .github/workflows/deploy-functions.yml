# Deploys a Supabase Edge Function from this repository, on demand: Actions → "Deploy Supabase function" → Run workflow.
# Replaces copying the code into the Supabase dashboard editor. Needs, once:
#   - secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens), in Settings → Secrets and variables → Actions;
#   - variable SUPABASE_URL (already set for the site build): the project ref is read from it.
# Function secrets (ANTHROPIC_API_KEY…) stay in Supabase; this only uploads the code. "Verify JWT" stays on (the default).
name: Deploy Supabase function

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        type: choice
        options: [cv-tailor, explain-mistake, job-search, delete-account, follow-up-reminders, search-alerts]
        default: cv-tailor

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy ${{ inputs.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (see the comment at the top of this file)."; exit 1
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::The SUPABASE_URL variable is missing or not a supabase.co address."; exit 1
          fi
          # --yes: the CLI asks for a confirmation a workflow cannot answer. --remote replaces --project-ref (CLI v3+).
          npx --yes supabase functions deploy "${{ inputs.function }}" --remote="$ref" --use-api --yes
