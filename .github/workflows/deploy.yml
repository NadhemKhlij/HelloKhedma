# Builds HelloKhedma (Tailwind CSS + js/config.js), runs the smoke tests on the built site, and publishes it to
# GitHub Pages on every push to main. Pushes to other branches run the build and the tests only (nothing published),
# so a change can be checked before it reaches main. A failing test stops the deploy: the live site stays as it was.
# Test failures show as annotations on the run (Playwright "github" reporter), readable without signing in.
# One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables tab:
#     SUPABASE_URL, SUPABASE_ANON_KEY (public by design), optional DEFAULT_COUNTRY, CONTACT_EMAIL, SENTRY_DSN
name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions > Variables (Repository variables), then re-run this workflow."
            exit 1
          fi

      - name: Install
        run: npm install

      - name: Build CSS and config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          DEFAULT_COUNTRY: ${{ vars.DEFAULT_COUNTRY || 'fr' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: npm run build

      # Publish only the files the browser needs (no supabase/, scripts/, tests/ or node_modules/).
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js icons css js content _site/

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npx playwright test

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
